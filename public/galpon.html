<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <title>Galpón Tutu · Agentes</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #db2777; --brand-soft: #3b0a24; --ink: #e8edf5; --ink-2: #9fb0c6; --muted: #6b7d96;
      --bg: #070b14; --panel: #0f1626; --panel-2: #16203450; --line: #223049; --line-2: #2e3f5c;
      --green: #4ade80; --amber: #fbbf24; --red: #f87171; --blue: #60a5fa; --violet: #c084fc; --cyan: #22d3ee; --orange: #fb923c;
      --radius: 12px; --chat-h: 150px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Fira Sans', system-ui, sans-serif; }
    #scene { position: fixed; inset: 0 0 var(--chat-h) 0; display: block; touch-action: none; }
    .top { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; z-index: 10; pointer-events: none; }
    .logo { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; box-shadow: inset 0 0 0 3px rgba(255,255,255,.3); pointer-events: auto; }
    .top h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; text-shadow: 0 2px 12px #000; }
    .top .hint { margin-left: auto; font-size: 12px; color: var(--ink-2); background: #0f162688; border: 1px solid var(--line); padding: 5px 10px; border-radius: 20px; pointer-events: auto; backdrop-filter: blur(6px); }
    .loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: var(--bg); transition: opacity .5s; }
    .loading.gone { opacity: 0; pointer-events: none; }
    .loading .l { text-align: center; color: var(--ink-2); }
    .spin { width: 42px; height: 42px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; margin: 0 auto 14px; animation: sp 1s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }

    /* Panel del agente */
    #agent { position: fixed; top: 60px; right: 12px; bottom: calc(var(--chat-h) + 12px); width: 420px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 20px 60px #000a; display: none; flex-direction: column; overflow: hidden; z-index: 20; }
    #agent.show { display: flex; animation: slide .2s cubic-bezier(.2,.7,.3,1); }
    @keyframes slide { from { transform: translateX(16px); opacity: .5; } }
    .ag-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; border-bottom: 1px solid var(--line); }
    .ag-av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; font-size: 17px; }
    .ag-id { flex: 1; min-width: 0; }
    .ag-id h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .ag-id p { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); }
    .ag-x { background: none; border: 0; color: var(--ink-2); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 20px; }
    .ag-x:hover { background: var(--panel-2); color: var(--ink); }
    .ag-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .chip-btn { background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); border-radius: 18px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; font-weight: 500; transition: all .15s; }
    .chip-btn:hover { border-color: var(--accent, var(--brand)); color: #fff; background: var(--accent-soft, var(--brand-soft)); }
    .ag-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .ag-body::-webkit-scrollbar { width: 8px; } .ag-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
    .msg { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; }
    .msg.me { background: var(--brand-soft); border-color: #5e2142; align-self: flex-end; max-width: 85%; }
    .msg h4 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--accent, var(--brand)); letter-spacing: .02em; text-transform: uppercase; }
    .msg p { margin: 6px 0; } .msg p:first-child { margin-top: 0; } .msg p:last-child { margin-bottom: 0; }
    .big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .kpi { background: #0c1322; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .kpi .t { font-size: 11px; color: var(--muted); } .kpi .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
    table.rep { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.rep th, table.rep td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    table.rep th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
    table.rep td.n, table.rep th.n { text-align: right; font-variant-numeric: tabular-nums; }
    .bars { display: flex; flex-direction: column; gap: 6px; }
    .bar-row { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 8px; font-size: 12px; }
    .bar-row .lab { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { height: 16px; background: #0c1322; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent, var(--brand)); border-radius: 4px; min-width: 2px; }
    .bar-row .val { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
    .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .t-green { background: #052e16; color: var(--green); } .t-amber { background: #3a2405; color: var(--amber); } .t-red { background: #3f0d0d; color: var(--red); } .t-blue { background: #0c1f45; color: var(--blue); } .t-gray { background: #1e293b; color: var(--ink-2); }
    .pend li { margin: 4px 0; font-size: 13px; }
    .diagram { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
    .node { background: #0c1322; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; text-align: center; }
    .node .n { font-weight: 700; font-size: 15px; } .node .l { font-size: 10px; color: var(--muted); }
    .arrow { color: var(--muted); }

    /* Chat inferior */
    #chat { position: fixed; left: 0; right: 0; bottom: 0; height: var(--chat-h); background: var(--panel); border-top: 1px solid var(--line); z-index: 15; display: flex; flex-direction: column; }
    .chat-log { flex: 1; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
    .chat-log::-webkit-scrollbar { width: 8px; } .chat-log::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
    .cl { font-size: 13px; max-width: 80%; padding: 8px 12px; border-radius: 12px; line-height: 1.45; }
    .cl.user { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 3px; }
    .cl.sys { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); border-bottom-left-radius: 3px; }
    .cl.sys b { color: var(--ink); }
    .chat-in { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: center; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .chat-in .who { font-size: 11px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
    .chat-in input { flex: 1; background: #0c1322; border: 1px solid var(--line-2); border-radius: 22px; padding: 11px 16px; color: var(--ink); font-size: 15px; outline: none; min-width: 0; }
    .chat-in input:focus { border-color: var(--brand); }
    .chat-in button { background: var(--brand); border: 0; color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; flex: none; display: grid; place-items: center; font-size: 18px; }
    .chat-in button:hover { background: #ec4899; }
    .suggest { display: flex; gap: 6px; padding: 0 12px 8px; overflow-x: auto; }
    .suggest::-webkit-scrollbar { display: none; }
    .suggest button { white-space: nowrap; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); border-radius: 16px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    .suggest button:hover { color: #fff; border-color: var(--brand); }
    .label3d { position: absolute; transform: translate(-50%, -100%); background: #0f1626dd; border: 1px solid var(--line); color: var(--ink); font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 12px; pointer-events: none; white-space: nowrap; backdrop-filter: blur(4px); transition: opacity .2s; }
    .label3d.staff { opacity: .92; font-weight: 500; font-size: 10.5px; }
    .label3d .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .gate { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #070b14; padding: 16px; }
    .gate.hidden { display: none; }
    .gate-card { background: #0f1626; border: 1px solid #223049; border-radius: 14px; padding: 28px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px #000a; }
    .gate-card input { background: #0c1322; border: 1px solid #2e3f5c; border-radius: 8px; padding: 11px 12px; color: #e8edf5; font-size: 16px; }
    .gate-card .btn-go { background: #db2777; border: 0; color: #fff; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .gate-card .btn-go:hover { background: #ec4899; }
    @media (max-width: 760px) {
      :root { --chat-h: 140px; }
      #agent { top: auto; bottom: calc(var(--chat-h) + 8px); right: 8px; left: 8px; width: auto; max-height: 55vh; }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading"><div class="l"><div class="spin"></div>Construyendo el galpón…</div></div>
  <canvas id="scene"></canvas>
  <div class="top">
    <div class="logo">T</div>
    <h1>Galpón Tutu Automotores</h1>
    <div class="hint" id="hint">Girá con el mouse · tocá una oficina</div>
  </div>
  <div id="labels"></div>

  <div id="agent">
    <div class="ag-head">
      <div class="ag-av" id="agAv"></div>
      <div class="ag-id"><h3 id="agName"></h3><p id="agRole"></p></div>
      <button class="ag-x" id="agClose" aria-label="Cerrar">×</button>
    </div>
    <div class="ag-actions" id="agActions"></div>
    <div class="ag-body" id="agBody"></div>
  </div>

  <div id="chat">
    <div class="chat-log" id="chatLog"></div>
    <div class="suggest" id="suggest"></div>
    <div class="chat-in">
      <input id="chatInput" placeholder="Preguntá algo… (ej: cómo van las ventas del mes)" autocomplete="off">
      <button id="chatSend" aria-label="Enviar">➤</button>
    </div>
  </div>

  <div id="gate" class="gate hidden">
    <form id="gateForm" class="gate-card">
      <div class="login-head" style="display:flex;align-items:center;gap:10px"><div class="logo" style="width:30px;height:30px;border-radius:50%;background:#db2777;color:#fff;display:grid;place-items:center;font-weight:700">T</div><h2 style="margin:0;font-size:18px">Galpón Tutu</h2></div>
      <p style="color:#9fb0c6;font-size:13px;margin:0">Ingresá la contraseña de Ventas para ver el galpón con los datos reales.</p>
      <input name="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="btn-go" type="submit">Entrar</button>
      <p id="gateErr" style="color:#f87171;font-size:13px;min-height:16px;margin:0"></p>
    </form>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/galpon/world.js"></script>
  <script src="/galpon/data-live.js"></script>
</body>
</html>
